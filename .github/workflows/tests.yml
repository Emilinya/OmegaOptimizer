name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v4.4.0
      with:
          persist-credentials: false
    - uses: Swatinem/rust-cache@v2.9.3
    - name: Build
      run: cargo build
    - name: Format
      run: |
        VERBOSE=1 make format
        git diff --exit-code
    - name: Lint
      run: VERBOSE=1 make lint CLIPPY_OPTS="-D warnings"
    - name: Run tests
      run: VERBOSE=1 make check
